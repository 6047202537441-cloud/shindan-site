<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>睡眠診断サイト - あなたに合った睡眠を知る</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <!-- 画面全体を包む16:9のステージ -->
    <div id="stage" class="stage">
      <!-- 背景となるCanva画像 -->
      <img id="bg-image" src="images/2.png" alt="睡眠診断サイト" class="bg-image">

      <!-- タップできる透明ボタンを配置するエリア -->
      <div id="buttons-layer" class="buttons-layer"></div>

      <!-- 結果画面用のテキスト表示エリア -->
      <div id="result-overlay" class="result-overlay hidden">
        <p id="result-subtitle" class="result-subtitle"></p>
        <ul id="result-advice-list" class="result-advice-list"></ul>
        <button id="retry-btn" class="retry-btn" onclick="resetQuiz()">もう一度診断する</button>
      </div>
    </div>

    <!-- 進行状況バー（質問中のみ表示） -->
    <div id="progress-area" class="progress-area hidden">
      <span id="progress-text">質問 1 / 6</span>
      <button class="back-btn" onclick="prevQuestion()">← 前の質問に戻る</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
