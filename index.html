<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>睡眠タイプ診断</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- スタート画面 -->
    <div id="start-screen" class="screen active">
      <h1>睡眠タイプ診断</h1>
      <p class="description">論文とアンケートデータに基づいたチェック診断です。</p>
      <!-- CanvaのアニメーションGIF（なければ通常の画像でも可） -->
      <img src="images/top-anim.gif" alt="睡眠キャラクター" class="mascot-img" onerror="this.src='https://via.placeholder.com/200?text=Canva+GIF'">
      <button class="btn" onclick="startQuiz()">診断をはじめる</button>
    </div>

    <!-- 質問画面 -->
    <div id="quiz-screen" class="screen">
      <div class="progress" id="progress">質問 1 / 3</div>
      <h2 id="question-text">ここに質問文が入ります</h2>
      <div id="options-container" class="options-group">
        <!-- 選択肢ボタンがJavaScriptで自動作成されます -->
      </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen">
      <h2>診断結果</h2>
      <div id="result-title" class="result-title"></div>
      <img id="result-image" src="" alt="結果画像" class="mascot-img">
      <p id="result-detail" class="result-detail"></p>
      <button class="btn" onclick="resetQuiz()">もう一度診断する</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
